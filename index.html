<style>
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --ink:#17211F; --muted:#5B6965; --line:#DBE1DD; --soft:#E7ECE9;
  --accent:#1B4DDB; --accent-ink:#FFFFFF; --warn:#9A3B0A; --warn-bg:#FCEBDC; --ok:#0B6B61; --bad:#B42318;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1514; --surface:#16211F; --ink:#E9F0ED; --muted:#93A29D; --line:#2A3835; --soft:#22302D;
    --accent:#86A2FF; --accent-ink:#0A1024; --warn:#F6B98A; --warn-bg:#3A2314; --ok:#5FD4C4; --bad:#FF9C8F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1514; --surface:#16211F; --ink:#E9F0ED; --muted:#93A29D; --line:#2A3835; --soft:#22302D;
  --accent:#86A2FF; --accent-ink:#0A1024; --warn:#F6B98A; --warn-bg:#3A2314; --ok:#5FD4C4; --bad:#FF9C8F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--body);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:520px;margin:0 auto;padding:14px 16px 112px}
h2{font:700 20px/1.2 var(--display);margin:28px 0 10px;letter-spacing:-.01em}
p{margin:0}
small{color:var(--muted)}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;background:none;border:0;color:var(--muted);font:500 12px var(--body)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const fmtEUR = c => new Intl.NumberFormat('es-ES', {style: 'currency', currency: 'EUR'}).format(c / 100);
const sum = l => l.reduce((a, e) => a + e.amt, 0);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLabel = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-ES', {weekday: 'short', day: 'numeric', month: 'short'}); };
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return cap(new Date(y, m - 1, 1).toLocaleDateString('es-ES', {month: 'long', year: 'numeric'})); };
const shiftDate = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

function cleanAmt(s) {
  s = s.replace(/[^\d.,]/g, '');
  const i = s.search(/[.,]/);
  if (i < 0) return s.slice(0, 6);
  const a = s.slice(0, i).slice(0, 6) || '0';
  const b = s.slice(i + 1).replace(/[.,]/g, '').slice(0, 2);
  return a + ',' + b;
}
function parseAmt(s) {
  const m = /^(\d+)(?:,(\d{0,2}))?$/.exec(s || '');
  if (!m) return 0;
  return parseInt(m[1], 10) * 100 + parseInt((m[2] || '').padEnd(2, '0'), 10);
}
function fit(input) { input.style.width = Math.max(2, input.value.length + 0.3) + 'ch'; }

/* ---------- estado ---------- */
const DEFAULT_CATS = [['Supermercado','#2E8B57'],['Restaurantes y café','#E07A1F'],['Transporte','#1B4DDB'],['Vivienda','#7A4FD3'],['Salud','#D6455D'],['Ocio','#0E9AA7'],['Compras','#B8860B'],['Suscripciones','#5B6C8F'],['Otros','#7A8580']];
const PALETTE = ['#2E8B57','#E07A1F','#1B4DDB','#7A4FD3','#D6455D','#0E9AA7','#B8860B','#5B6C8F','#C2417A','#4C9F38','#8C5E3C','#3D7EA6'];
const NONE = {id: '', name: 'Sin categoría', color: '#7A8580'};
let state = null, idb = null, dl = null;
const ui = {tab: 'add', month: today().slice(0, 7), filterCat: null, sumHide: new Set()};
let draft = {amt: '', cat: '', note: '', date: today(), auto: true};
const health = {ls: null, idb: null, persist: null};

function freshState() {
  const now = new Date().toISOString();
  return {v: 1, rev: 0, updatedAt: now,
    cats: DEFAULT_CATS.map(([name, color], i) => ({id: 'cat-' + i, name, color, u: 0})),
    exps: [], del: {}, meta: {created: now, lastExport: null, changes: 0, snooze: 0}};
}
const okCat = c => !!c && typeof c.id === 'string' && typeof c.name === 'string';
const okExp = e => !!e && typeof e.id === 'string' && Number.isInteger(e.amt) && e.amt > 0 && typeof e.cat === 'string' && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date);
function valid(o) { return !!o && typeof o === 'object' && Array.isArray(o.cats) && Array.isArray(o.exps) && o.cats.every(okCat) && o.exps.every(okExp); }
const normCat = c => ({id: c.id, name: String(c.name).slice(0, 30) || 'Sin nombre', color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#7A8580', u: Number.isFinite(c.u) ? c.u : 0, budget: (Number.isInteger(c.budget) && c.budget > 0) ? c.budget : 0});
const normExp = e => { const ts = Number.isFinite(e.ts) ? e.ts : (Date.parse(e.date) || 0); return {id: e.id, amt: e.amt, cat: e.cat, note: String(e.note || '').slice(0, 80), date: e.date, ts, u: Number.isFinite(e.u) ? e.u : ts}; };
function normDel(d) { const r = {}; if (d && typeof d === 'object') for (const k in d) if (Number.isFinite(d[k])) r[k] = d[k]; return r; }
function normalize(o) {
  const now = new Date().toISOString();
  return {v: 1, rev: Number.isInteger(o.rev) ? o.rev : 0, updatedAt: o.updatedAt || now,
    cats: o.cats.filter(okCat).map(normCat), exps: o.exps.filter(okExp).map(normExp), del: normDel(o.del),
    meta: Object.assign({created: now, lastExport: null, changes: 0, snooze: 0}, (o.meta && typeof o.meta === 'object') ? o.meta : {})};
}
const sortExps = l => l.slice().sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts || a.id.localeCompare(b.id));
/* Une dos versiones: gana la modificación más reciente de cada gasto/categoría; una lápida borra lo que sea más viejo que ella. */
function mergeStates(a, b) {
  const del = Object.assign({}, a.del || {});
  for (const k in (b.del || {})) del[k] = Math.max(del[k] || 0, b.del[k]);
  const cut = Date.now() - 180 * 864e5;
  for (const k in del) if (del[k] < cut) delete del[k];
  const pick = (xs, ys) => {
    const m = new Map();
    xs.concat(ys).forEach(x => { const p = m.get(x.id); if (!p || (x.u || 0) > (p.u || 0)) m.set(x.id, x); });
    return [...m.values()].filter(x => !(del[x.id] !== undefined && del[x.id] >= (x.u || 0)));
  };
  return Object.assign({}, a, {cats: pick(a.cats, b.cats), exps: sortExps(pick(a.exps, b.exps)), del});
}
const isPristine = s => !s.exps.length && !(s.meta.changes > 0) && !Object.keys(s.del).length && s.cats.length === DEFAULT_CATS.length && s.cats.every((c, i) => c.name === DEFAULT_CATS[i][0]);
function removeExp(id) { state.exps = state.exps.filter(x => x.id !== id); state.del[id] = Date.now(); }
function restoreExp(x) { x.u = Date.now(); delete state.del[x.id]; state.exps.push(x); }
function replaceAll(inc) {
  const now = Date.now(), keep = new Set(inc.cats.map(c => c.id).concat(inc.exps.map(e => e.id)));
  const del = Object.assign({}, state.del);
  state.cats.concat(state.exps).forEach(x => { if (!keep.has(x.id)) del[x.id] = now; });
  inc.cats.forEach(c => { c.u = now + 1; }); inc.exps.forEach(e => { e.u = now + 1; });
  inc.del = del; inc.rev = state.rev; inc.meta = state.meta; state = inc;
}
const catBy = id => state.cats.find(c => c.id === id) || NONE;
const catKey = e => state.cats.some(c => c.id === e.cat) ? e.cat : '__none';
const monthExps = mk => state.exps.filter(e => e.date.startsWith(mk));

/* ---------- almacenamiento en dos capas + copias internas ---------- */
const LS_KEY = 'gastos.v1', STORE = 'kv';
function openIDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('gastos-db', 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbReq(mode, fn) {
  return new Promise(res => {
    if (!idb) return res(null);
    try {
      const t = idb.transaction(STORE, mode);
      const r = fn(t.objectStore(STORE));
      t.oncomplete = () => res(r && 'result' in r ? r.result : true);
      t.onerror = t.onabort = () => res(null);
    } catch (e) { res(null); }
  });

const idbGet = k => idbReq('readonly', s => s.get(k)).then(v => v === true ? null : v);

function backupDue(ignoreSnooze) {
  const m = state.meta;
  if (!state.exps.length || !(m.changes > 0)) return null;
  if (!ignoreSnooze && m.snooze && Date.now() < m.snooze) return null;
  if (!m.lastExport) return m.changes >= 5 ? {text: 'Aún no tienes ninguna copia descargada. Si se borran los datos del navegador, perderías tus gastos.'} : null;
  const days = Math.floor((Date.now() - Date.parse(m.lastExport)) / 864e5);
  if (days >= 7 || m.changes >= 25) return {text: days >= 7 ? `Hace ${days} días que no descargas una copia (${m.changes} cambios sin respaldar).` : `Tienes ${m.changes} cambios sin respaldar.`};
  return null;
}
function relTime(iso) {
  const days = Math.floor((Date.now() - Date.parse(iso)) / 864e5);
  return days <= 0 ? 'hoy' : days === 1 ? 'ayer' : `hace ${days} días`;
}

}
/* Entrega un archivo real: 1) descarga directa del visor, 2) hoja de compartir del celular (Guardar en Archivos), 3) descarga del navegador. */
async function deliverFile(filename, content, mime) {
  if (dl) {
    try { await dl.save({filename, data: content}); return 'saved'; }
    catch (e) { if (e && e.code === 'declined') return 'cancelled'; if (e && e.code === 'rate_limited') return 'busy'; }
  }
  const blob = new Blob([content], {type: mime});
  if (isMobile() && canShareFiles()) {
    try { await navigator.share({files: [new File([blob], filename, {type: mime})], title: filename}); return 'saved'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

  } catch (e) { return 'failed'; }
}

  else if (r === 'cancelled') toast('No se guardó el archivo');

}

function donutSVG(items, total) {

    const len = total ? it.sum / total * C : 0;
    const gap = items.length > 1 ? Math.min(2, len * 0.3) : 0;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${it.color}" stroke-width="16" stroke-dasharray="${Math.max(len - gap, 0.01).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`;
    acc += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Gasto por categoría"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--soft)" stroke-width="16"/><g transform="rotate(-90 70 70)">${segs}</g></svg>`;
}

  const peak = sums.indexOf(Math.max(...sums));

  const tick = isCur ? (day / D * 100).toFixed(1) : null;
  const cls = (sp, cp) => sp > cp ? 'over' : (sp / cp >= 0.85 ? 'warn' : 'ok');
  const bar = (sp, cp) => `<div class="bar2 ${cls(sp, cp)}"><i style="width:${Math.min(100, sp / cp * 100).toFixed(1)}%"></i>${tick !== null ? `<u style="left:${tick}%"></u>` : ''}</div>`;
  let pace = '';
  if (isCur) { const exp = Math.round(cap * day / D), diff = spent - exp; pace = `<p class="pace">A hoy (día ${day} de ${D}) lo esperado es ${fmtEUR(exp)}: vas ${fmtEUR(Math.abs(diff))} ${diff > 0 ? 'por encima' : 'por debajo'} del ritmo. La marca vertical de cada barra señala dónde deberías ir hoy.</p>`; }
  return `<h2>Topes del mes</h2>
  <div class="card budsum"><small>${left >= 0 ? 'Te quedan' : 'Te pasaste por'}</small><b class="big ${cls(spent, cap)}-t">${fmtEUR(Math.abs(left))}</b>
    <p>Has gastado ${fmtEUR(spent)} de ${fmtEUR(cap)} en las categorías con tope.</p>${bar(spent, cap)}${pace}${noCap ? `<p>Además, ${fmtEUR(noCap)} en categorías sin tope.</p>` : ''}</div>
  <div class="list" style="margin-top:12px">${rows.map(r => { const k = cls(r.spent, r.cap), rest = r.cap - r.spent;
    return `<div class="bud"><div class="top"><i class="dot" style="background:${r.c.color}"></i><span class="nm">${esc(r.c.name)}</span><span class="v">${fmtEUR(r.spent)} <small>/ ${fmtEUR(r.cap)}</small></span></div>${bar(r.spent, r.cap)}<div class="sub ${k}-t">${rest >= 0 ? 'Quedan ' + fmtEUR(rest) : 'Te pasaste por ' + fmtEUR(-rest)} · ${Math.round(r.p * 100)} %</div></div>`; }).join('')}</div>`;
}
function viewSum() {
  const hide = ui.sumHide;
  [...hide].forEach(k => { if (k !== '__none' && !state.cats.some(c => c.id === k)) hide.delete(k); });
  const inSel = e => !hide.has(catKey(e));
  const mk = ui.month, all = monthExps(mk), list = all.filter(inSel), total = sum(list);
  const map = new Map();
  list.forEach(e => { const k = catKey(e), c = catBy(e.cat); const r = map.get(k) || {key: k, name: c.name, color: c.color, sum: 0}; r.sum += e.amt; map.set(k, r); });
  const items = [...map.values()].sort((a, b) => b.sum - a.sum);
  const [y, m] = mk.split('-').map(Number), D = new Date(y, m, 0).getDate();
  const endDate = mk === today().slice(0, 7) ? today() : `${mk}-${pad(D)}`;
  const win = new Set(Array.from({length: 7}, (_, i) => shiftDate(endDate, -i)));
  const win7 = sum(state.exps.filter(e => win.has(e.date) && inSel(e)));
  const prevTotal = sum(monthExps(shiftMonth(mk, -1)).filter(inSel));
  return `${monthBar(mk)}
  ${sumFilter(all)}
  <div class="donutwrap">${donutSVG(items, total)}<div class="mid"><b>${fmtEUR(total)}</b><small>${list.length} ${list.length === 1 ? 'gasto' : 'gastos'}</small></div></div>
  <div class="stats"><div class="stat"><small>Prom. diario · 7 días</small><b>${fmtEUR(Math.round(win7 / 7))}</b></div><div class="stat"><small>Mes anterior</small><b>${fmtEUR(prevTotal)}</b></div><div class="stat"><small>Mayor gasto</small><b>${list.length ? fmtEUR(Math.max(...list.map(e => e.amt))) : '—'}</b></div></div>
  ${budgetSection(list, mk)}
  ${items.length ? `<h2>Por categoría</h2><div class="list">${items.map(it => `<button class="catline" style="--c:${it.color}" data-catfilter="${it.key}"><span class="top"><i class="dot"></i><span class="nm">${esc(it.name)}</span><span class="pc">${Math.round(it.sum / total * 100)} %</span><span class="v">${fmtEUR(it.sum)}</span></span><span class="bar"><i style="width:${(it.sum / total * 100).toFixed(1)}%"></i></span></button>`).join('')}</div>
  <h2>Por día</h2>${dailySVG(mk, list)}` : `<div class="list"><p class="empty">${hide.size && all.length ? 'No hay gastos en las categorías visibles de este mes.' : 'No hay gastos en este mes.'}</p></div>`}`;
}
function viewHist() {
  const mk = ui.month;
  let list = monthExps(mk);
  if (ui.filterCat !== null) list = list.filter(e => catKey(e) === ui.filterCat);
  const days = {};
  list.forEach(e => { (days[e.date] = days[e.date] || []).push(e); });
  const fname = ui.filterCat !== null ? (ui.filterCat === '__none' ? NONE.name : catBy(ui.filterCat).name) : '';
  const body = Object.keys(days).sort().reverse().map(d => {
    const es = days[d].sort((a, b) => b.ts - a.ts);
    return `<div class="dayhead"><span>${dayLabel(d)}</span><b>${fmtEUR(sum(es))}</b></div><div class="list">${es.map(e => rowHTML(e)).join('')}</div>`;
  }).join('');
  return `${monthBar(mk)}
  ${ui.filterCat !== null ? `<button class="filterchip" data-a="clearfilter">${esc(fname)} <span aria-hidden="true">✕</span><span class="sr">Quitar filtro</span></button>` : ''}
  ${body || `<div class="list" style="margin-top:14px"><p class="empty">No hay gastos${ui.filterCat !== null ? ' con este filtro' : ' en este mes'}.</p></div>`}`;
}
const fmtBudgetInput = c => c % 100 === 0 ? String(c / 100) : (c / 100).toFixed(2).replace('.', ',');
const budTotalText = () => { const t = state.cats.reduce((a, c) => a + (c.budget || 0), 0); return t ? `Total de topes mensuales: ${fmtEUR(t)}` : 'Aún no defines ningún tope.'; };
function viewSet() {
  const m = state.meta;
  const pers = health.persist === true ? ['ok', 'Activada'] : health.persist === false ? ['mid', 'No garantizada'] : ['mid', 'Sin verificar'];
  const st = (label, ok) => `<div class="st"><span>${label}</span><b class="${ok ? 'ok' : 'bad'}">${ok ? 'Activo' : 'No disponible'}</b></div>`;
  return `
  <h2>Copia de seguridad</h2>
  <div class="card">
    <p class="big"><b>Última copia descargada:</b> ${m.lastExport ? relTime(m.lastExport) : 'nunca'}${m.changes ? ` · ${m.changes} cambios sin respaldar` : ''}</p>
    <button class="btn primary" data-a="exportjson">Descargar copia (.json)</button>
    <button class="btn" data-a="exportcsv">Exportar a Excel (.csv)</button>
    <button class="btn" data-a="importjson">Restaurar desde archivo</button>
    <button class="btn ghost" data-a="exporttext">Copiar como texto (si la descarga no funciona)</button>
  </div>
  <h2>Categorías</h2>
  <div class="card">
    ${state.cats.map(c => `<div class="catrow"><input type="color" value="${c.color}" data-catcolor="${c.id}" aria-label="Color de ${esc(c.name)}"><input class="field" value="${esc(c.name)}" maxlength="30" data-catname="${c.id}" aria-label="Nombre de la categoría"><button class="iconbtn" data-catdel="${c.id}" aria-label="Eliminar ${esc(c.name)}">×</button></div>`).join('')}
    <div class="catrow" style="margin-top:12px"><input class="field" id="newcat" maxlength="30" placeholder="Nueva categoría"><button class="btn small primary" id="addcat" style="min-height:44px">Añadir</button></div>
  </div>
  <h2>Topes mensuales</h2>
  <div class="card">
    <p class="note" style="margin:0 0 12px">Cuánto esperas gastar al mes en cada categoría. Déjalo vacío si no quieres tope. Se compara con tus gastos en Resumen.</p>
    ${state.cats.map(c => `<div class="budrow"><i class="dot" style="background:${c.color}"></i><span class="bn">${esc(c.name)}</span><label class="budin"><span class="sr">Tope mensual de ${esc(c.name)}</span><input class="field" inputmode="decimal" autocomplete="off" placeholder="Sin tope" data-catbudget="${c.id}" value="${(c.budget || 0) ? fmtBudgetInput(c.budget) : ''}"><span>€</span></label></div>`).join('')}
    <p class="note" id="budtotal">${budTotalText()}</p>
  </div>
  <h2>Protección de tus datos</h2>
  <div class="card">
    ${st('Guardado en este navegador', health.ls)}
    ${st('Segundo almacén (espejo)', health.idb)}
    <div class="st"><span>Protección contra limpieza</span><b class="${pers[0]}">${pers[1]}</b></div>
    <div class="st"><span>Descarga de archivos</span><b class="ok">${dl ? 'Directa' : (isMobile() && canShareFiles() ? 'Hoja de compartir' : 'Del navegador')}</b></div>
    <p class="note">Cada gasto se guarda en dos lugares de este dispositivo y se toma una copia interna al abrir la app cada día. No se envía nada a internet. El archivo descargado es tu respaldo para cambiar de teléfono o si se borran los datos del navegador.</p>
    <button class="btn" data-a="diag">Ver diagnóstico del guardado</button>
  </div>
  <h2>Copias internas</h2>
  <div class="card" id="snaps"><small>Cargando…</small></div>`;
}
function bindSet() {
  const add = () => {
    const name = $('#newcat').value.trim(); if (!name) return;
    if (state.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Ya existe una categoría con ese nombre'); return; }
    state.cats.push({id: uid(), name, color: PALETTE[state.cats.length % PALETTE.length], u: Date.now()});
    commit(); render();
  };
  $('#addcat').onclick = add;
  $('#newcat').addEventListener('keydown', ev => { if (ev.key === 'Enter') add(); });
  loadSnaps();
}
async function loadSnaps() {
  const keys = (await idbKeys()).filter(k => k.startsWith('snap:')).sort().reverse();
  const items = [];
  for (const k of keys) { try { const o = JSON.parse(await idbGet(k)); if (valid(o)) items.push({k, n: o.exps.length}); } catch (e) {} }
  const box = $('#snaps'); if (!box) return;
  if (!items.length) { box.innerHTML = '<small>Aún no hay copias internas. Se crea una al abrir la app cada día, cuando ya hay gastos.</small>'; return; }
  const names = {dia: 'Automática', 'antes-sincronizar': 'Antes de sincronizar', 'antes-importar': 'Antes de importar', 'antes-restaurar': 'Antes de restaurar'};
  box.innerHTML = items.map(({k, n}) => {
    const [, when, label] = k.split(':');
    const [d, t] = when.split('T');
    return `<div class="snap"><span>${dayLabel(d)} · ${t.slice(0, 2)}:${t.slice(2, 4)}<small>${names[label] || label} · ${n} ${n === 1 ? 'gasto' : 'gastos'}</small></span><button class="btn small" data-snap="${esc(k)}">Restaurar</button></div>`;
  }).join('');
}
async function restoreSnap(k) {
  let o = null;
  try { o = JSON.parse(await idbGet(k)); } catch (e) {}
  if (!valid(o)) { toast('Esa copia no se pudo leer'); return; }
  const inc = normalize(o);
  if (!(await confirmDlg('Restaurar copia interna', `Se reemplazarán tus datos actuales (${state.exps.length} gastos) por los de esa copia (${inc.exps.length} gastos). Antes se guarda una copia de lo actual.`, 'Reemplazar'))) return;
  await makeSnapshot('antes-restaurar');
  replaceAll(inc);
  await commit(); render(); toast('Copia restaurada');
}

/* ---------- editar ---------- */
function editExp(id) {
  const e = state.exps.find(x => x.id === id); if (!e) return;
  let cat = e.cat;
  showOverlay(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Editar gasto">
    <label class="amount sm" for="e_amt"><span class="sr">Monto en euros</span><input id="e_amt" inputmode="decimal" autocomplete="off" value="${(e.amt / 100).toFixed(2).replace('.', ',')}"><span class="eur">€</span></label>
    <div class="chips" id="e_chips">${chipsHTML(cat)}</div>
    <input id="e_note" class="field" maxlength="50" placeholder="Nota (opcional)" value="${esc(e.note)}">
    <div class="fieldrow"><label for="e_date">Fecha</label><input type="date" id="e_date" class="field" max="${today()}" value="${e.date}"></div>
    <button class="btn primary" id="e_save">Guardar cambios</button>
    <button class="btn danger" id="e_del">Eliminar gasto</button>
    <button class="btn ghost" id="e_cancel">Cancelar</button></div>`);
  const amt = $('#e_amt'); fit(amt);
  amt.addEventListener('input', () => { amt.value = cleanAmt(amt.value); fit(amt); });
  $('#e_chips').addEventListener('click', ev => {
    const b = ev.target.closest('.chip'); if (!b) return;
    cat = b.dataset.id;
    $('#e_chips').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('#e_cancel').onclick = hideOverlay;
  $('#ov').onclick = ev => { if (ev.target.id === 'ov') hideOverlay(); };
  $('#e_save').onclick = () => {
    const c = parseAmt(amt.value);
    if (!c) { toast('Escribe un monto válido'); return; }
    e.amt = c; e.cat = cat; e.note = $('#e_note').value.trim(); e.date = $('#e_date').value || e.date; e.u = Date.now();
    commit(); hideOverlay(); render(); toast('Cambios guardados');
  };
  $('#e_del').onclick = () => {
    const removed = e;
    removeExp(id);
    commit(); hideOverlay(); render();
    toast('Gasto eliminado', {action: 'Deshacer', fn: () => { restoreExp(removed); commit(); render(); }});
  };
}

/* ---------- eventos globales ---------- */
function setTab(t) { ui.tab = t; if (t !== 'hist') ui.filterCat = null; render(); window.scrollTo(0, 0); }
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-edit],[data-a],[data-catdel],[data-snap],[data-catfilter],[data-sumcat]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.edit) return editExp(d.edit);
  if (d.sumcat) {
    const hide = ui.sumHide, sc = $('.chipscroll') ? $('.chipscroll').scrollLeft : 0;
    if (d.sumcat === '__all') hide.clear(); else if (hide.has(d.sumcat)) hide.delete(d.sumcat); else hide.add(d.sumcat);
    render();
    const bar = $('.chipscroll'); if (bar) bar.scrollLeft = sc;
    return;
  }
  if (d.catfilter) { ui.filterCat = d.catfilter; return setTab('hist'); }
  if (d.snap) return restoreSnap(d.snap);
  if (d.catdel) {
    const c = state.cats.find(x => x.id === d.catdel); if (!c) return;
    const n = state.exps.filter(e => e.cat === c.id).length;
    confirmDlg(`Eliminar «${c.name}»`, n ? `Sus ${n} gastos se conservan y aparecerán como «Sin categoría».` : 'No tiene gastos registrados.', 'Eliminar categoría').then(ok => {
      if (!ok) return;
      state.cats = state.cats.filter(x => x.id !== c.id); state.del[c.id] = Date.now(); commit(); render();
    });
    return;
  }
  switch (d.a) {
    case 'prev': ui.month = shiftMonth(ui.month, -1); return render();
    case 'next': if (ui.month < today().slice(0, 7)) { ui.month = shiftMonth(ui.month, 1); render(); } return;
    case 'clearfilter': ui.filterCat = null; return render();
    case 'exportjson': return exportJSON();
    case 'exportcsv': return exportCSV();
    case 'exporttext': return showTextSheet(payloadText(), true);
    case 'diag': return showDiag();
    case 'importjson': return $('#file').click();
    case 'snooze': state.meta.snooze = Date.now() + 864e5; persist(); return render();
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.catname) {
    const c = state.cats.find(x => x.id === t.dataset.catname); if (!c) return;
    const v = t.value.trim();
    if (!v) { t.value = c.name; return; }
    if (state.cats.some(x => x.id !== c.id && x.name.toLowerCase() === v.toLowerCase())) { toast('Ya existe una categoría con ese nombre'); t.value = c.name; return; }
    c.name = v; c.u = Date.now(); commit();
  } else if (t.dataset && t.dataset.catcolor) {
    const c = state.cats.find(x => x.id === t.dataset.catcolor);
    if (c && /^#[0-9a-f]{6}$/i.test(t.value)) { c.color = t.value; c.u = Date.now(); commit(); }
  } else if (t.dataset && t.dataset.catbudget) {
    const c = state.cats.find(x => x.id === t.dataset.catbudget); if (!c) return;
    const v = t.value.trim(), cents = v ? parseAmt(v) : 0;
    c.budget = cents; c.u = Date.now(); commit();
    t.value = cents ? fmtBudgetInput(cents) : '';
    const tot = $('#budtotal'); if (tot) tot.textContent = budTotalText();
  } else if (t.id === 'file' && t.files && t.files[0]) {
    importFromFile(t.files[0]); t.value = '';
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.catbudget !== undefined) t.value = cleanAmt(t.value);
});

/* ---------- render ---------- */
function updateWarn() {
  const w = $('#warn'); if (!w) return;
  w.innerHTML = (health.ls === false && health.idb === false)
    ? '<div class="banner err" role="alert"><p>No se está guardando nada en este navegador (¿modo privado?). Descarga una copia desde Ajustes al terminar.</p></div>' : '';
  if (ui.tab === 'set' && state) { const s = $('#snaps'); if (!s) return; }
}
function render() {
  if (!state) return;
  document.querySelectorAll('nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
  $('#dot').hidden = !backupDue(true);
  updateWarn();
  $('#view').innerHTML = {add: viewAdd, sum: viewSum, hist: viewHist, set: viewSet}[ui.tab]();
  if (ui.tab === 'add') bindAdd();
  if (ui.tab === 'set') bindSet();
}

(async function init() {
  const {recovered} = await load();
  render();
  if (recovered) toast('Recuperamos tus datos desde una copia interna');
  initDownloads().then(() => { if (ui.tab === 'set') render(); });
  installManifest();
  askPersist().then(() => updateStatus());
})();
</script>
</body>
</html>
